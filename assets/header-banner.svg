<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>F1 race winner prediction model banner</title>
<defs>
  <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" x="0" y="0" fill="#e6e6e6"/>
    <rect width="14" height="14" x="14" y="14" fill="#e6e6e6"/>
    <rect width="14" height="14" x="14" y="0" fill="#111111"/>
    <rect width="14" height="14" x="0" y="14" fill="#111111"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0a0a0a" stop-opacity="1"/>
    <stop offset="0.15" stop-color="#0a0a0a" stop-opacity="0"/>
    <stop offset="0.85" stop-color="#0a0a0a" stop-opacity="0"/>
    <stop offset="1" stop-color="#0a0a0a" stop-opacity="1"/>
  </linearGradient>
</defs>

<rect width="1200" height="240" fill="#0a0a0a"/>

<g opacity="0.9">
  <rect x="0" y="0" width="1200" height="16" fill="url(#checker)"/>
  <rect x="0" y="224" width="1200" height="16" fill="url(#checker)"/>
</g>

<g stroke="#c81e2c" stroke-width="3" opacity="0.55">
  <line x1="-40" y1="60" x2="220" y2="60"/>
  <line x1="-40" y1="80" x2="180" y2="80"/>
  <line x1="-40" y1="100" x2="240" y2="100"/>
  <line x1="960" y1="150" x2="1240" y2="150"/>
  <line x1="1020" y1="170" x2="1240" y2="170"/>
  <line x1="980" y1="190" x2="1240" y2="190"/>
</g>

<rect width="1200" height="240" fill="url(#fade)"/>

<g transform="translate(600,120)" text-anchor="middle">
  <text y="-14" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#f2f2f2" letter-spacing="2">
    F1 RACE WINNER PREDICTION
  </text>
  <text y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#c81e2c" letter-spacing="6">
    POST-QUALIFYING WIN PROBABILITY MODEL
  </text>
</g>
</svg>
