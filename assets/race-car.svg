<svg width="400" height="160" viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Stylized F1 car silhouette</title>

<g fill="#111111">
  <!-- front wing -->
  <rect x="20" y="108" width="70" height="8" rx="2"/>
  <rect x="20" y="100" width="14" height="8" rx="2"/>

  <!-- nose cone to cockpit -->
  <path d="M90,108 L150,108 Q170,108 178,92 L200,70 Q210,60 226,58 L300,54 Q320,54 326,62 L332,74 L332,100 L120,100 Q100,100 90,108 Z"/>

  <!-- cockpit halo -->
  <path d="M226,58 Q222,36 244,32 Q262,30 268,44 L268,58 Z" fill="#111111"/>
  <path d="M232,56 Q230,42 246,40 Q258,38 262,48 L262,56 Z" fill="#0a0a0a"/>

  <!-- engine cover to rear -->
  <path d="M268,58 L300,54 Q320,54 326,62 L332,74 L340,74 Q352,74 352,88 L352,100 L332,100 Z"/>

  <!-- rear wing -->
  <rect x="336" y="40" width="8" height="52" rx="2"/>
  <rect x="322" y="34" width="46" height="9" rx="2"/>

  <!-- sidepod detail -->
  <path d="M226,70 L300,66 L300,90 L226,90 Z" opacity="0.85"/>
</g>

<!-- wheels -->
<g>
  <circle cx="96" cy="120" r="22" fill="#111111"/>
  <circle cx="96" cy="120" r="10" fill="#e6e6e6"/>
  <circle cx="310" cy="120" r="22" fill="#111111"/>
  <circle cx="310" cy="120" r="10" fill="#e6e6e6"/>
</g>

<!-- red accent stripe -->
<path d="M178,92 L200,70 Q210,60 226,58 L300,54" fill="none" stroke="#c81e2c" stroke-width="4" stroke-linecap="round"/>

<!-- ground line -->
<line x1="10" y1="142" x2="390" y2="142" stroke="#c81e2c" stroke-width="2" opacity="0.5"/>
</svg>
